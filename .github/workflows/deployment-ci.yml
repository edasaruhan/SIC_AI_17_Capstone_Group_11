name: Deployment CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            deploy/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r deploy/requirements-dev.txt pip-audit

      - name: Export deployment artifacts
        run: python deploy/scripts/export_artifacts.py

      - name: Run forecasting tests
        run: python -m unittest discover -s extensions/forecasting/tests -v

      - name: Run deployment tests
        run: >-
          python -m pytest deploy/tests -q
          --cov=app --cov=monitoring
          --cov-report=term-missing
          --cov-fail-under=80

      - name: Audit runtime dependencies
        run: python -m pip_audit -r deploy/requirements.txt

      - name: Build Docker image
        run: docker build -f deploy/Dockerfile -t food-demand-api:ci .

      - name: Smoke-test Docker container
        run: |
          docker run -d --name food-demand-api-ci -p 8000:8000 -e API_KEYS=ci-test-key food-demand-api:ci
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs food-demand-api-ci
            exit 1
          fi
          response=$(curl --fail --silent \
            -H "X-API-Key: ci-test-key" \
            -H "Content-Type: application/json" \
            -d '{"week":136,"center_id":10,"meal_id":1062,"checkout_price":194.06,"base_price":194.06,"emailer_for_promotion":0,"homepage_featured":0,"category":"Beverages","cuisine":"Italian","center_type":"TYPE_B","city_code":590,"region_code":56,"op_area":6.3,"recent_orders":[1538,700,704,960]}' \
            http://127.0.0.1:8000/predict)
          echo "$response" | grep -q '"predicted_orders"'

      - name: Stop Docker container
        if: always()
        run: docker rm --force food-demand-api-ci 2>/dev/null || true
