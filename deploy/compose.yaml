services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    environment:
      API_KEYS: ${API_KEYS:?Set API_KEYS in deploy/.env}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-120}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      PREDICTION_LOG: /srv/logs/predictions.jsonl
    volumes:
      - ./logs:/srv/logs
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    restart: unless-stopped
